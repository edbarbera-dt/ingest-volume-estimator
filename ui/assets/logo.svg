<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Ingest Volume Estimator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F2DA8"/>
      <stop offset="1" stop-color="#1496FF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- inflow: data dropping in -->
  <path d="M14 10v8m-3.5-3.5L14 18l3.5-3.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- measured volume bars -->
  <rect x="10" y="38" width="8" height="16" rx="2" fill="#fff"/>
  <rect x="22" y="31" width="8" height="23" rx="2" fill="#fff"/>
  <rect x="34" y="24" width="8" height="30" rx="2" fill="#fff"/>
  <!-- estimated (projected) bar -->
  <rect x="47" y="15" width="6" height="38" rx="2" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 2.5"/>
</svg>
